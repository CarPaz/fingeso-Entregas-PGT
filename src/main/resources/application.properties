# Activar perfil local
spring.profiles.active=local

spring.application.name=entregas
# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/pgt
spring.datasource.username=${DB_USER:pgt_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Almacenamiento local
app.storage.location=${APP_STORAGE_LOCATION:./storage/entregas}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# SMTP - solo si corresponde
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
#Apagado de la autentificacion y el TLS para entorno local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false