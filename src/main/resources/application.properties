# Activar perfil local
spring.profiles.active=local

spring.application.name=entregas
# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/pgt
spring.datasource.username=${DB_USER:pgt_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Almacenamiento local
app.storage.location=${APP_STORAGE_LOCATION:./storage/entregas}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# SMTP
# Mailpit local usa localhost:1025 sin autenticación ni TLS.
# Para un proveedor real, estos valores se reemplazan con variables de entorno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:notificaciones@sistema.local}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}

# Evita que un servidor SMTP sin respuesta bloquee indefinidamente una petición.
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT:3000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
